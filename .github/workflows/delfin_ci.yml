name: Delfin CI
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.platform }}
    strategy:
      max-parallel: 6
      matrix:
        platform: [ubuntu-22.04]
        python-version: [ 3.8 ]

    steps:
      - uses: actions/checkout@v4
      - name: Install Python version ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test-requirements.txt
          # Pin pyasn1 to 0.4.x to retain compatibility with code importing
          # pyasn1.compat.octets (pyasn1 0.5 removed the compat submodule).
          python -m pip install 'pyasn1<0.5'
          pip install tox codecov
      - name: Unit test with tox
        run: tox
      - name: Test coverage with  codecov
        run: codecov
