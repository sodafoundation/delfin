name: Delfin CI
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.platform }}
    strategy:
      max-parallel: 6
      matrix:
        platform: [ubuntu-22.04]
        python-version: [ 3.8 ]

    steps:
      - uses: actions/checkout@v4
      - name: Install Python version ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test-requirements.txt
          pip install tox codecov
      - name: Install flake8 (pinned)
        run: |
          python -m pip install flake8==6.1.0
      - name: Lint with flake8 (ignore E231)
        run: |
          flake8 --extend-ignore=E231 delfin
      - name: Unit test with tox (py3 env)
        run: |
          tox -e py3
      - name: Test coverage with codecov
        run: codecov
