name: Delfin CI
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.platform }}
    strategy:
      max-parallel: 6
      matrix:
        platform: [ubuntu-22.04]
        python-version: [ 3.8 ]

    steps:
      - uses: actions/checkout@v4
      - name: Install Python version ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test-requirements.txt
          # Ensure the runner uses the exact versions our tests expect
          python -m pip install pysnmp==4.4.12 jsonschema==3.2.0 flake8==6.1.0 codecov
      - name: Install flake8 (pinned)
        run: |
          python -m pip install flake8==6.1.0
      - name: Lint with flake8 (ignore E231)
        run: |
          flake8 --extend-ignore=E231 delfin
      - name: Run unit tests (coverage)
        run: |
          coverage erase
          coverage run -m unittest discover delfin/tests/unit
          coverage html -d htmlcov
      - name: Test coverage with codecov
        run: codecov
